<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CoBanq — FCA-regulated international money transfers, business payments, and multi-currency wallets, since 2003." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <title>CoBanq — Powering the flow of global capital</title>
  </head>
  <body>
    <!--
      Netlify Forms detection.

      Netlify scans the deployed HTML at build time to register forms, and a
      React SPA renders its forms in JS where the scanner can't see them.
      These hidden copies exist purely so the form names and fields are
      registered; the real submissions are posted by src/components/EnquiryForm.jsx.
      Keep the `name` and the field `name`s in sync with the React forms, and
      set the destination address under Site configuration → Forms → Notifications.
    -->
    <form name="business-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="interest" />
      <input type="text" name="corridors" />
      <input type="text" name="volume" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <form name="white-label-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="url" name="website" />
      <input type="text" name="volume" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
